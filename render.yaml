# Render Blueprint — provisions the CyberQalqon API and its Postgres database
# together, so you don't have to configure them by hand.
#
# How to use:
#   1. Push this file to GitHub (already done if you're reading it in the repo).
#   2. Go to https://dashboard.render.com/blueprints and click "New Blueprint Instance".
#   3. Pick the `cyberqalqon` repo and click "Apply".
#   4. Render creates the database + API and wires DATABASE_URL automatically.
#
# After it finishes, the API is live at:
#   https://cyberqalqon-api.onrender.com
# The frontend already defaults to that URL in production.

databases:
  - name: cyberqalqon-db
    plan: free
    databaseName: cyberqalqon
    user: cyberqalqon
    region: oregon

services:
  - type: web
    name: cyberqalqon-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyberqalqon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://halolhack.netlify.app
      - key: NODE_VERSION
        value: "22"
