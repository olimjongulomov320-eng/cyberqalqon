name: Deploy frontend to GitHub Pages

# Builds the Next.js frontend as a static export and publishes it to GitHub
# Pages. Free for public repos (Actions minutes are unlimited for public repos).
#
# One-time setup after the first run: repo Settings > Pages > Build and
# deployment > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/curriculum/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          # Project Pages are served from https://<user>.github.io/<repo>/.
          BASE_PATH: /cyberqalqon
          NEXT_PUBLIC_API_URL: https://cyberqalqon-api.onrender.com
          # Absolute base for OG/Twitter preview URLs.
          NEXT_PUBLIC_SITE_URL: https://olimjongulomov320-eng.github.io/cyberqalqon
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
